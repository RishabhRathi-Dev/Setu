name: Container image

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: container-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '26'
          cache: maven
      - name: Check source, documentation and Python tools
        run: |
          python3 scripts/check-source.py
          python3 scripts/check-docs.py
          python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Verify functional contracts
        run: bash ./mvnw --batch-mode --no-transfer-progress -pl setu-integration-tests -am test
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build runnable image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: setu:ci
          platforms: linux/amd64
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Validate Compose deployments
        run: |
          docker compose config --quiet
          docker compose -f compose.yaml -f compose.image.yaml config --quiet
          docker compose -f compose.yaml -f compose.lgtm.yaml config --quiet
          docker compose -f compose.yaml -f compose.image.yaml -f compose.lgtm.yaml config --quiet
      - name: Exercise container and durable restart
        run: python3 scripts/verify-container.py --image setu:ci
      - name: Export tested image
        run: |
          set -o pipefail
          docker save setu:ci | gzip > target/setu-image.tar.gz
          cd target
          sha256sum setu-image.tar.gz > setu-image.tar.gz.sha256
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: setu-container-image
          path: target/setu-image.tar.gz*
          compression-level: 0
          retention-days: 14
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: container-verification
          path: |
            target/container-smoke/
            **/target/surefire-reports/
          retention-days: 14

  publish-image:
    needs: verify-image
    if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: setu-container-image
          path: image
      - name: Load verified image
        working-directory: image
        run: |
          sha256sum --check setu-image.tar.gz.sha256
          docker load --input setu-image.tar.gz
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the tested image
        env:
          REPOSITORY: ${{ github.repository }}
          REVISION: ${{ github.sha }}
        run: |
          image="ghcr.io/${REPOSITORY,,}"
          docker tag setu:ci "$image:sha-$REVISION"
          docker tag setu:ci "$image:latest"
          docker push "$image:sha-$REVISION"
          docker push "$image:latest"
          printf 'Published `%s:sha-%s` and `%s:latest` (linux/amd64).\n' "$image" "$REVISION" "$image" >> "$GITHUB_STEP_SUMMARY"
