name: Source security gate

on:
  push:
  pull_request:
  schedule:
    - cron: '20 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      # CodeQL reads workflow-run metadata even when SARIF upload is disabled.
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '26'
          cache: maven
      - uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          languages: java-kotlin
          build-mode: manual
          queries: security-extended
      - name: Build production sources for analysis
        run: bash ./mvnw --batch-mode --no-transfer-progress -pl setu-server -am -Dmaven.test.skip=true clean package
      - uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          output: codeql-results
          upload: never
          upload-database: false
      - name: Enforce high and critical source findings
        run: python3 scripts/check-codeql.py codeql-results
      - name: Retain static analysis evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: source-security-reports
          path: codeql-results/*.sarif
          retention-days: 14
