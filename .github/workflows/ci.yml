name: Build, integration tests, and sustained benchmark

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      full_benchmark:
        description: 'Run the full three-repeat sustained comparison and 1 KiB performance gates'
        default: false
        type: boolean
      resource_fraction:
        description: 'Share of detected available CPU, memory and free disk (0 < share <= 1)'
        default: '0.8'
        type: string

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java 26
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '26'
          cache: maven

      - name: Build and test production modules
        run: bash ./mvnw --batch-mode --no-transfer-progress -pl setu-benchmark -am '-Dtest=*Tests,!*ChaosTests,!*BenchmarkTests' -Dsurefire.failIfNoSpecifiedTests=false test

      - name: Test benchmark launchers, reports and badge publication
        run: python3 -m unittest discover -s scripts -p 'test_benchmark*.py'

      - name: Retain unit and benchmark-helper test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-results
          path: '**/target/surefire-reports/'
          retention-days: 14

      - name: Package application and verify secure AOT coverage with ZGC
        shell: bash
        run: |
          set -o pipefail
          bash ./mvnw --batch-mode --no-transfer-progress -pl setu-server -am -DskipTests package
          bash ./scripts/start-broker.sh --train-aot
          java @config/jvm.options -XX:AOTMode=on \
            -XX:AOTCache=setu-server/target/setu-server.aot \
            "-Xlog:aot=info,class+load=info:file=$RUNNER_TEMP/aot-jvm.log" \
            -jar setu-server/target/setu-server-1.0.0-SNAPSHOT.jar --aot-train \
            2>&1 | tee "$RUNNER_TEMP/aot-validation.log"
          python3 - <<'PY'
          import os, pathlib
          report = (pathlib.Path(os.environ["RUNNER_TEMP"]) / "aot-validation.log").read_text()
          # JVM logging can interrupt printf while formatting loads a class. Keep it separate.
          vm_report = (pathlib.Path(os.environ["RUNNER_TEMP"]) / "aot-jvm.log").read_text()
          # Chronicle's module exports/opens disable the archived full module graph on some JDKs.
          # Strict AOTMode plus per-class checks still require the application cache to be used.
          assert "Opened AOT cache" in vm_report, "The AOT cache was not opened"
          for name in ("io.setu.server.security.SecuredRequestProcessor", "io.setu.client.SetuClient",
                       "io.setu.core.broker.DefaultBroker", "io.setu.storage.log.InMemoryMessageLog",
                       "io.setu.storage.log.ChronicleMessageLog", "io.setu.storage.log.GroupCommitMessageLog",
                       "io.setu.security.authentication.MtlsAuthenticator", "io.setu.security.authorization.InMemoryAuthorizer",
                       "io.setu.security.quota.TokenBucketRateLimiter", "io.setu.security.tls.SetuKeyManagerProvider",
                       "io.setu.security.tls.SetuTrustManagerProvider"):
              assert name + " source: shared objects file" in vm_report, name + " was not loaded from the AOT cache"
          lines = [dict(field.split("=", 1) for field in line.split()[1:])
                   for line in report.splitlines() if line.startswith("AOT_TRAINING ")]
          for mode in ("IN_MEMORY", "FILE"):
              for transport in ("plaintext", "mtls"):
                  stage = next(row for row in lines if row["mode"] == mode and row["transport"] == transport)
                  assert stage["completed"] == "true" and stage["record_bytes"] == "1024"
                  if transport == "mtls":
                      assert all(stage[key] == "allow_and_deny" for key in ("authentication", "authorization", "quotas"))
          assert "AOT_BACKPRESSURE budget_bytes=65536 rejected=true reclaimed=true retry=accepted" in report
          assert "AOT_COVERAGE modules=setu-server,setu-client,setu-core,setu-storage,setu-security gc=ZGC string_dedup_requested=true completed=true" in report
          assert "AOT_RUNTIME gc=ZGC string_dedup_requested=true string_dedup_actual=true aot_mode=on" in report, "Cached runtime did not report ZGC, active string deduplication and strict AOT mode"
          PY

      - name: Retain AOT validation logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: aot-validation-logs
          path: '${{ runner.temp }}/aot-*.log'
          retention-days: 14

  integration-tests:
    runs-on: ubuntu-latest
    needs: unit-tests
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java 26
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '26'
          cache: maven

      - name: Run end-to-end application integration tests
        run: bash ./mvnw --batch-mode --no-transfer-progress -pl setu-integration-tests -am '-Dtest=*IntegrationTests' -Dsurefire.failIfNoSpecifiedTests=false test

      - name: Retain integration test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: integration-test-results
          path: '**/target/surefire-reports/'
          retention-days: 14

  chaos-benchmark:
    runs-on: ubuntu-latest
    needs: integration-tests
    timeout-minutes: 60
    env:
      BENCHMARK_FRACTION: ${{ inputs.resource_fraction || vars.SETU_BENCHMARK_FRACTION || '0.8' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java 26
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '26'
          cache: maven

      - name: Run bounded broker chaos tests
        shell: bash
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/logs"
          python3 scripts/run-benchmarks.py --kind chaos --payload-sizes 1024 \
            --fraction "$BENCHMARK_FRACTION" --log "$RUNNER_TEMP/logs/bounded-chaos.log"

      - name: Verify benchmark report isolation
        run: python3 -m unittest discover -s scripts -p 'test_benchmark*.py'

      - name: Measure steady throughput in isolated broker and client processes
        shell: bash
        run: |
          set -o pipefail
          python3 scripts/run-benchmarks.py --kind steady --payload-sizes 1024 \
            --fraction "$BENCHMARK_FRACTION" --log "$RUNNER_TEMP/logs/steady-throughput.log"

      - name: Run the short sustained smoke profile
        run: >-
          python3 scripts/run-benchmarks.py --kind sustained --measurement smoke
          --payload-sizes 1024 --fraction "$BENCHMARK_FRACTION"

      - name: Summarize post-run optimization findings
        if: always()
        run: |
          if [ -d logs/benchmarks/resources ]; then
            find logs/benchmarks/resources -name optimization.md -exec cat {} + >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Retain benchmark logs and failure reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-smoke-${{ github.run_attempt }}
          path: |
            logs/benchmarks/
            !logs/benchmarks/**/data/**
            ${{ runner.temp }}/logs/
            **/target/surefire-reports/
          retention-days: 14

  sustained-full:
    if: github.event_name == 'workflow_dispatch' && inputs.full_benchmark
    needs: chaos-benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        mode: [IN_MEMORY, FILE]
        payload: [256, 512, 1024, 4096]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '26'
          cache: maven
      - name: Measure independent full repetitions
        env:
          BENCHMARK_FRACTION: ${{ inputs.resource_fraction || vars.SETU_BENCHMARK_FRACTION || '0.8' }}
          BENCHMARK_MODE: ${{ matrix.mode }}
          BENCHMARK_PAYLOAD: ${{ matrix.payload }}
        run: >-
          python3 scripts/run-benchmarks.py --kind sustained --measurement full
          --storage-mode "$BENCHMARK_MODE" --payload-sizes "$BENCHMARK_PAYLOAD"
          --fraction "$BENCHMARK_FRACTION"
      - name: Summarize measurements, including failed gates
        if: always()
        run: |
          if [ -d logs/benchmarks/resources ]; then
            find logs/benchmarks/resources \( -name comparison.txt -o -name optimization.md \) -exec cat {} + >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Retain raw captures and report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sustained-${{ matrix.mode }}-${{ matrix.payload }}-${{ github.run_attempt }}
          path: |
            logs/benchmarks/resources/
            logs/benchmarks/sustained/
            **/target/surefire-reports/
          retention-days: 14

  performance-baseline:
    needs: integration-tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        mode: [IN_MEMORY, FILE]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '26'
          cache: maven
      - name: Enforce sustained CI baseline under a fixed resource budget
        env:
          BENCHMARK_MODE: ${{ matrix.mode }}
        run: >-
          python3 scripts/run-benchmarks.py --kind baseline --measurement full
          --storage-mode "$BENCHMARK_MODE" --payload-sizes 1024
          --data-directory "$RUNNER_TEMP"
      - name: Summarize baseline qualification, including failures
        if: always()
        run: |
          if [ -d logs/benchmarks/resources ]; then
            find logs/benchmarks/resources -name comparison.txt -exec cat {} + >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Retain baseline measurements, JFR and test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: performance-baseline-${{ matrix.mode }}-${{ github.run_attempt }}
          path: |
            logs/benchmarks/resources/
            logs/benchmarks/ci-baseline/
            **/target/surefire-reports/
          retention-days: 14

  node-target-benchmark:
    needs: integration-tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        mode: [IN_MEMORY, FILE]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '26'
          cache: maven
      - name: Measure three independent node-target repetitions with JFR
        env:
          BENCHMARK_MODE: ${{ matrix.mode }}
          BENCHMARK_FRACTION: ${{ inputs.resource_fraction || vars.SETU_BENCHMARK_FRACTION || '0.8' }}
        run: >-
          python3 scripts/run-benchmarks.py --kind target --measurement full
          --storage-mode "$BENCHMARK_MODE" --payload-sizes 1024
          --fraction "$BENCHMARK_FRACTION" --report-only
      - name: Summarize target measurements, including failed qualification
        if: always()
        run: |
          if [ -d logs/benchmarks/resources ]; then
            find logs/benchmarks/resources -name comparison.txt -exec cat {} + >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Retain target measurements, JFR and test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: node-target-${{ matrix.mode }}-${{ github.run_attempt }}
          path: |
            logs/benchmarks/resources/
            logs/benchmarks/node-target/
            **/target/surefire-reports/
          retention-days: 14

  publish-benchmark-badges:
    needs: [unit-tests, integration-tests, node-target-benchmark]
    if: >-
      always() && needs.unit-tests.result == 'success' && needs.integration-tests.result == 'success'
      && needs.node-target-benchmark.result != 'cancelled'
      && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
      && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: benchmark-badges-${{ github.repository }}-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/download-artifact@v8
        with:
          pattern: node-target-*-${{ github.run_attempt }}
          path: reports
      - name: Generate latest target and JFR badges with qualification and provenance
        env:
          WORKFLOW_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SOURCE_REVISION: ${{ github.sha }}
        run: >-
          python3 scripts/publish-node-target-badges.py --input reports --workflow-url "$WORKFLOW_URL"
          --revision "$SOURCE_REVISION" --allow-incomplete
      - name: Commit measured badge data
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          SOURCE_REVISION: ${{ github.sha }}
        run: |
          git fetch origin "$DEFAULT_BRANCH"
          if [ "$(git rev-parse FETCH_HEAD)" != "$SOURCE_REVISION" ]; then
            echo "A newer commit exists; its workflow will publish the latest measurements."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md benchmark-badges/*.json benchmark-badges/*.svg
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Update node-target benchmark and JFR badges [skip ci]"
          git push origin "HEAD:$DEFAULT_BRANCH"
