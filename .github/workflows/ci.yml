name: Build, integration tests, and capacity benchmark

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      resource_fraction:
        description: 'Share of detected available CPU, memory and free disk (0 < share <= 1)'
        default: '0.8'
        type: string
      payload_sizes:
        description: 'Payload comparison sizes in bytes, comma separated'
        default: '256,512,1024,4096'
        type: string

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java 26
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '26'
          cache: maven

      - name: Build and test production modules
        run: bash ./mvnw --batch-mode --no-transfer-progress -pl setu-storage,setu-core,setu-security,setu-client,setu-server -am test

      - name: Package application and verify secure AOT coverage with ZGC
        shell: bash
        run: |
          set -o pipefail
          bash ./mvnw --batch-mode --no-transfer-progress -pl setu-server -am -DskipTests package
          bash ./scripts/start-broker.sh --train-aot
          java -XX:+UseZGC -XX:+UseStringDeduplication -XX:AOTMode=on \
            -XX:AOTCache=setu-server/target/setu-server.aot -Xlog:aot=info,class+load=info \
            -jar setu-server/target/setu-server-1.0.0-SNAPSHOT.jar --aot-train \
            2>&1 | tee "$RUNNER_TEMP/aot-validation.log"
          python3 - <<'PY'
          import os, pathlib
          report = (pathlib.Path(os.environ["RUNNER_TEMP"]) / "aot-validation.log").read_text()
          assert "Using AOT-linked classes: true" in report, "AOT-linked classes were not enabled"
          for name in ("io.setu.server.security.SecuredRequestProcessor", "io.setu.client.SetuClient",
                       "io.setu.core.broker.DefaultBroker", "io.setu.storage.log.InMemoryMessageLog",
                       "io.setu.storage.log.FileMessageLog", "io.setu.storage.log.GroupCommitMessageLog",
                       "io.setu.security.authentication.MtlsAuthenticator", "io.setu.security.authorization.InMemoryAuthorizer",
                       "io.setu.security.quota.TokenBucketRateLimiter", "io.setu.security.tls.SetuKeyManagerProvider",
                       "io.setu.security.tls.SetuTrustManagerProvider"):
              assert name + " source: shared objects file" in report, name + " was not loaded from the AOT cache"
          lines = [dict(field.split("=", 1) for field in line.split()[1:])
                   for line in report.splitlines() if line.startswith("AOT_TRAINING ")]
          for mode in ("IN_MEMORY", "FILE"):
              for transport in ("plaintext", "mtls"):
                  stage = next(row for row in lines if row["mode"] == mode and row["transport"] == transport)
                  assert stage["completed"] == "true" and stage["record_bytes"] == "1024"
                  if transport == "mtls":
                      assert all(stage[key] == "allow_and_deny" for key in ("authentication", "authorization", "quotas"))
          assert "AOT_BACKPRESSURE budget_bytes=65536 rejected=true reclaimed=true retry=accepted" in report
          assert "AOT_COVERAGE modules=setu-server,setu-client,setu-core,setu-storage,setu-security gc=ZGC string_dedup_requested=true completed=true" in report
          assert "AOT_RUNTIME gc=ZGC string_dedup_requested=true string_dedup_actual=true aot_mode=on" in report
          PY

  integration-tests:
    runs-on: ubuntu-latest
    needs: unit-tests
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java 26
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '26'
          cache: maven

      - name: Run end-to-end application integration tests
        run: bash ./mvnw --batch-mode --no-transfer-progress -pl setu-integration-tests -am '-Dtest=*IntegrationTests' -Dsurefire.failIfNoSpecifiedTests=false test

  chaos-benchmark:
    runs-on: ubuntu-latest
    needs: integration-tests
    timeout-minutes: 60
    concurrency:
      group: benchmark-badges-${{ github.repository }}-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: write
    env:
      BENCHMARK_FRACTION: ${{ inputs.resource_fraction || vars.SETU_BENCHMARK_FRACTION || '0.8' }}
      BENCHMARK_PAYLOADS: ${{ inputs.payload_sizes || vars.SETU_BENCHMARK_PAYLOADS || '256,512,1024,4096' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java 26
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '26'
          cache: maven

      - name: Run bounded broker chaos tests
        shell: bash
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/logs"
          python3 scripts/run-benchmarks.py --kind chaos --payload-sizes 1024 \
            --fraction "$BENCHMARK_FRACTION" --log "$RUNNER_TEMP/logs/bounded-chaos.log"

      - name: Verify benchmark report isolation
        run: python3 -m unittest discover -s scripts -p 'test_benchmark*.py'

      - name: Measure steady throughput in isolated broker and client processes
        shell: bash
        run: |
          set -o pipefail
          python3 scripts/run-benchmarks.py --kind steady --payload-sizes 1024 \
            --fraction "$BENCHMARK_FRACTION" --log "$RUNNER_TEMP/logs/steady-throughput.log"

      - name: Compare payload sizes with a shared host resource budget
        shell: bash
        run: |
          python3 scripts/run-benchmarks.py --kind sweep --fraction "$BENCHMARK_FRACTION" \
            --payload-sizes "$BENCHMARK_PAYLOADS" --repeats 3 --max-concurrency 8 \
            --stage-millis 3000 --warmup-millis 2000
          cat logs/benchmarks/resources/sweep-*/comparison.txt >> "$GITHUB_STEP_SUMMARY"

      - name: Measure bounded file ingestion with larger batches
        shell: bash
        run: |
          set -o pipefail
          python3 scripts/run-benchmarks.py --kind large-batch --payload-sizes 1024 \
            --fraction "$BENCHMARK_FRACTION" --log "$RUNNER_TEMP/logs/capacity-large-batch.log"

      - name: Run progressive capacity exhaustion last
        shell: bash
        run: |
          set -o pipefail
          python3 scripts/run-benchmarks.py --kind capacity --payload-sizes 1024 \
            --fraction "$BENCHMARK_FRACTION" --log "$RUNNER_TEMP/logs/capacity-default.log"

      - name: Generate badges from the latest capacity metrics
        if: success() && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        run: >-
          python3 scripts/update-benchmark-badges.py
          --log "$RUNNER_TEMP/logs/capacity-default.log"
          --repository "$GITHUB_REPOSITORY"
          --server-url "$GITHUB_SERVER_URL"
          --visibility "${{ github.event.repository.private && 'private' || 'public' }}"
          --minimum-stages 8 --require-jfr

      - name: Retain benchmark logs and failure reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-diagnostics-${{ github.run_attempt }}
          path: |
            logs/
            ${{ runner.temp }}/logs/
            **/target/surefire-reports/
          retention-days: 14

      - name: Publish latest benchmark badges
        if: success() && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md benchmark-badges/*.json
          if git diff --cached --quiet; then
            echo "Benchmark badge metrics are unchanged."
            exit 0
          fi
          git commit -m "Update benchmark metric badges [skip ci]"
          git push origin "HEAD:${{ github.event.repository.default_branch }}"
