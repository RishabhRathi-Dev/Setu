name: Build, integration tests, and sustained benchmark

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      full_benchmark:
        description: 'Run the full three-repeat sustained comparison and 1 KiB performance gates'
        default: false
        type: boolean
      resource_fraction:
        description: 'Share of detected available CPU, memory and free disk (0 < share <= 1)'
        default: '0.8'
        type: string
      trace_file_waits:
        description: 'Run only the unchanged FILE baseline with diagnostic kernel/resource sampling'
        default: false
        type: boolean
      trace_storage_only:
        description: 'With trace_file_waits, trace only the short broker-free storage probe'
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  postgres-outbox:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: setu_test
          POSTGRES_USER: setu_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd "pg_isready -U setu_test -d setu_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '26'
          cache: maven
      - name: Verify PostgreSQL outbox and inbox transactions
        env:
          SETU_TEST_POSTGRES_URL: jdbc:postgresql://localhost:5432/setu_test
          SETU_TEST_POSTGRES_USER: setu_test
        run: >-
          bash ./mvnw --batch-mode --no-transfer-progress -pl setu-integration-tests -am
          '-Dtest=PostgresOutboxIntegrationTests' '-Dsurefire.failIfNoSpecifiedTests=false' test
  windows-functional:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '26'
          cache: maven
      - name: Run functional TCP, mTLS and filesystem tests on Windows
        shell: pwsh
        run: .\mvnw.cmd --batch-mode --no-transfer-progress -pl setu-integration-tests -am test
      - name: Package and exercise the Windows launcher
        shell: pwsh
        run: |
          .\mvnw.cmd --batch-mode --no-transfer-progress -pl setu-server -am -DskipTests package
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\scripts\start-broker.ps1 --no-aot --help
      - name: Retain Windows test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-functional-results
          path: '**/target/surefire-reports/'
          retention-days: 14

  trace-file-waits:
    if: github.event_name == 'workflow_dispatch' && inputs.trace_file_waits
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '26'
          cache: maven
      - name: Observe kernel waits during the original FILE baseline
        env:
          TRACE_STORAGE_ONLY: ${{ inputs.trace_storage_only }}
        shell: bash
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/force-trace"
          findmnt -T "$RUNNER_TEMP" -o SOURCE,FSTYPE,OPTIONS > "$RUNNER_TEMP/force-trace/storage.txt"
          sudo python3 scripts/diagnostics/trace-force-waits.py \
            --output "$RUNNER_TEMP/force-trace" --stop-file "$RUNNER_TEMP/force-trace.stop" \
            > "$RUNNER_TEMP/force-trace/observer.log" 2>&1 &
          observer=$!
          trap 'touch "$RUNNER_TEMP/force-trace.stop"; wait "$observer" || true' EXIT
          if [[ "$TRACE_STORAGE_ONLY" == true ]]; then
            mkdir -p "$RUNNER_TEMP/force-trace/classes" "$RUNNER_TEMP/storage-probe"
            javac -d "$RUNNER_TEMP/force-trace/classes" scripts/diagnostics/StorageForceProbe.java
            sudo systemd-run --quiet --wait --pipe --collect --service-type=exec \
              --unit="setu-force-probe-${{ github.run_id }}" --uid="$(id -u)" --gid="$(id -g)" \
              --working-directory="$GITHUB_WORKSPACE" \
              -p CPUQuota=160% -p AllowedCPUs=0,1 -p MemoryMax=5368709120 -p MemorySwapMax=0 \
              "$JAVA_HOME/bin/java" @config/jvm.options -Xms64m -Xmx128m -XX:ActiveProcessorCount=2 \
              "-XX:StartFlightRecording=filename=$RUNNER_TEMP/force-trace/storage.jfr,settings=profile,dumponexit=true" \
              -cp "$RUNNER_TEMP/force-trace/classes" io.setu.storage.log.StorageForceProbe \
              "$RUNNER_TEMP/storage-probe" | tee "$RUNNER_TEMP/force-trace/storage-probe.log"
          else
            python3 scripts/run-benchmarks.py --kind baseline --measurement full \
              --storage-mode FILE --payload-sizes 1024 --data-directory "$RUNNER_TEMP"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: file-force-kernel-trace
          path: |
            ${{ runner.temp }}/force-trace/
            logs/benchmarks/resources/
            logs/benchmarks/ci-baseline/
            **/target/surefire-reports/
          retention-days: 14

  unit-tests:
    if: ${{ !inputs.trace_file_waits }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java 26
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '26'
          cache: maven

      - name: Build and test production modules
        run: bash ./mvnw --batch-mode --no-transfer-progress -pl setu-benchmark -am '-Dtest=*Tests,!*ChaosTests,!*BenchmarkTests' -Dsurefire.failIfNoSpecifiedTests=false test

      - name: Test benchmark launchers, reports and badge publication
        run: python3 -m unittest discover -s scripts -p 'test_*.py'

      - name: Verify mapped-file durability barriers and delayed-force accounting
        shell: bash
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/file-force-probe/classes"
          javac -d "$RUNNER_TEMP/file-force-probe/classes" \
            setu-storage/src/main/java/io/setu/storage/log/ChronicleFileSync.java \
            scripts/diagnostics/FileForceProbe.java
          java --enable-native-access=ALL-UNNAMED -cp "$RUNNER_TEMP/file-force-probe/classes" \
            io.setu.storage.log.FileForceProbe "$RUNNER_TEMP/file-force-probe" \
            | tee "$RUNNER_TEMP/file-force-probe/probe.log"

      - name: Retain file-force diagnostic evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: file-force-probe
          path: |
            ${{ runner.temp }}/file-force-probe/*.jfr
            ${{ runner.temp }}/file-force-probe/*.log
          retention-days: 14

      - name: Retain unit and benchmark-helper test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unit-test-results
          path: '**/target/surefire-reports/'
          retention-days: 14

      - name: Package application and verify secure AOT coverage with ZGC
        shell: bash
        run: |
          set -o pipefail
          bash ./mvnw --batch-mode --no-transfer-progress -pl setu-server -am -DskipTests package
          bash ./scripts/start-broker.sh --train-aot
          java @config/jvm.options -XX:AOTMode=on \
            -XX:AOTCache=setu-server/target/setu-server.aot \
            "-Xlog:aot=info,class+load=info:file=$RUNNER_TEMP/aot-jvm.log" \
            -jar setu-server/target/setu-server-1.0.0-SNAPSHOT.jar --aot-train \
            2>&1 | tee "$RUNNER_TEMP/aot-validation.log"
          python3 - <<'PY'
          import os, pathlib
          report = (pathlib.Path(os.environ["RUNNER_TEMP"]) / "aot-validation.log").read_text()
          # JVM logging can interrupt printf while formatting loads a class. Keep it separate.
          vm_report = (pathlib.Path(os.environ["RUNNER_TEMP"]) / "aot-jvm.log").read_text()
          # Chronicle's module exports/opens disable the archived full module graph on some JDKs.
          # Strict AOTMode plus per-class checks still require the application cache to be used.
          assert "Opened AOT cache" in vm_report, "The AOT cache was not opened"
          for name in ("io.setu.server.security.SecuredRequestProcessor", "io.setu.client.SetuClient",
                       "io.setu.core.broker.DefaultBroker", "io.setu.storage.log.InMemoryMessageLog",
                       "io.setu.storage.log.ChronicleMessageLog", "io.setu.storage.log.GroupCommitMessageLog",
                       "io.setu.security.authentication.MtlsAuthenticator", "io.setu.security.authorization.InMemoryAuthorizer",
                       "io.setu.security.quota.TokenBucketRateLimiter", "io.setu.security.tls.SetuKeyManagerProvider",
                       "io.setu.security.tls.SetuTrustManagerProvider"):
              assert name + " source: shared objects file" in vm_report, name + " was not loaded from the AOT cache"
          lines = [dict(field.split("=", 1) for field in line.split()[1:])
                   for line in report.splitlines() if line.startswith("AOT_TRAINING ")]
          for mode in ("IN_MEMORY", "FILE"):
              for transport in ("plaintext", "mtls"):
                  stage = next(row for row in lines if row["mode"] == mode and row["transport"] == transport)
                  assert stage["completed"] == "true" and stage["record_bytes"] == "1024"
                  if transport == "mtls":
                      assert all(stage[key] == "allow_and_deny" for key in ("authentication", "authorization", "quotas"))
          assert "AOT_BACKPRESSURE budget_bytes=65536 rejected=true reclaimed=true retry=accepted" in report
          assert "AOT_COVERAGE modules=setu-server,setu-client,setu-core,setu-storage,setu-security gc=ZGC string_dedup_requested=true completed=true" in report
          assert "AOT_RUNTIME gc=ZGC string_dedup_requested=true string_dedup_actual=true aot_mode=on" in report, "Cached runtime did not report ZGC, active string deduplication and strict AOT mode"
          PY

      - name: Retain AOT validation logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: aot-validation-logs
          path: '${{ runner.temp }}/aot-*.log'
          retention-days: 14

  integration-tests:
    runs-on: ubuntu-latest
    needs: unit-tests
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java 26
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '26'
          cache: maven

      - name: Run end-to-end application integration tests
        run: bash ./mvnw --batch-mode --no-transfer-progress -pl setu-integration-tests -am '-Dtest=*IntegrationTests' -Dsurefire.failIfNoSpecifiedTests=false test

      - name: Retain integration test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: integration-test-results
          path: '**/target/surefire-reports/'
          retention-days: 14

  chaos-benchmark:
    runs-on: ubuntu-latest
    needs: integration-tests
    timeout-minutes: 60
    env:
      BENCHMARK_FRACTION: ${{ inputs.resource_fraction || vars.SETU_BENCHMARK_FRACTION || '0.8' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java 26
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '26'
          cache: maven

      - name: Run bounded broker chaos tests
        shell: bash
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/logs"
          python3 scripts/run-benchmarks.py --kind chaos --payload-sizes 1024 \
            --fraction "$BENCHMARK_FRACTION" --log "$RUNNER_TEMP/logs/bounded-chaos.log"

      - name: Verify benchmark report isolation
        run: python3 -m unittest discover -s scripts -p 'test_benchmark*.py'

      - name: Measure steady throughput in isolated broker and client processes
        shell: bash
        run: |
          set -o pipefail
          python3 scripts/run-benchmarks.py --kind steady --payload-sizes 1024 \
            --fraction "$BENCHMARK_FRACTION" --report-only --log "$RUNNER_TEMP/logs/steady-throughput.log"

      - name: Run the short sustained smoke profile
        run: >-
          python3 scripts/run-benchmarks.py --kind sustained --measurement smoke
          --payload-sizes 1024 --fraction "$BENCHMARK_FRACTION"

      - name: Summarize post-run optimization findings
        if: always()
        run: |
          if [ -d logs/benchmarks/resources ]; then
            find logs/benchmarks/resources -name optimization.md -exec cat {} + >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Retain benchmark logs and failure reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: benchmark-smoke-${{ github.run_attempt }}
          path: |
            logs/benchmarks/
            !logs/benchmarks/**/data/**
            ${{ runner.temp }}/logs/
            **/target/surefire-reports/
          retention-days: 14

  sustained-full:
    if: github.event_name == 'workflow_dispatch' && inputs.full_benchmark
    needs: chaos-benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        mode: [IN_MEMORY, FILE]
        payload: [256, 512, 1024, 4096]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '26'
          cache: maven
      - name: Measure independent full repetitions
        env:
          BENCHMARK_FRACTION: ${{ inputs.resource_fraction || vars.SETU_BENCHMARK_FRACTION || '0.8' }}
          BENCHMARK_MODE: ${{ matrix.mode }}
          BENCHMARK_PAYLOAD: ${{ matrix.payload }}
        run: >-
          python3 scripts/run-benchmarks.py --kind sustained --measurement full
          --storage-mode "$BENCHMARK_MODE" --payload-sizes "$BENCHMARK_PAYLOAD"
          --fraction "$BENCHMARK_FRACTION" --report-only
      - name: Summarize measurements, including failed gates
        if: always()
        run: |
          if [ -d logs/benchmarks/resources ]; then
            find logs/benchmarks/resources \( -name comparison.txt -o -name optimization.md \) -exec cat {} + >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Retain raw captures and report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sustained-${{ matrix.mode }}-${{ matrix.payload }}-${{ github.run_attempt }}
          path: |
            logs/benchmarks/resources/
            logs/benchmarks/sustained/
            **/target/surefire-reports/
          retention-days: 14

  performance-baseline:
    needs: integration-tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        mode: [IN_MEMORY, FILE]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '26'
          cache: maven
      - name: Measure CI baseline and warn on unmet expectations under a fixed resource budget
        env:
          BENCHMARK_MODE: ${{ matrix.mode }}
        run: >-
          python3 scripts/run-benchmarks.py --kind baseline --measurement full
          --storage-mode "$BENCHMARK_MODE" --payload-sizes 1024
          --data-directory "$RUNNER_TEMP" --report-only
      - name: Summarize baseline qualification, including failures
        if: always()
        run: |
          if [ -d logs/benchmarks/resources ]; then
            find logs/benchmarks/resources -name comparison.txt -exec cat {} + >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Retain baseline measurements, JFR and test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: performance-baseline-${{ matrix.mode }}-${{ github.run_attempt }}
          path: |
            logs/benchmarks/resources/
            logs/benchmarks/ci-baseline/
            **/target/surefire-reports/
          retention-days: 14

  node-target-benchmark:
    needs: integration-tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        mode: [IN_MEMORY, FILE]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '26'
          cache: maven
      - name: Measure three independent node-target repetitions with JFR
        env:
          BENCHMARK_MODE: ${{ matrix.mode }}
          BENCHMARK_FRACTION: ${{ inputs.resource_fraction || vars.SETU_BENCHMARK_FRACTION || '0.8' }}
        run: >-
          python3 scripts/run-benchmarks.py --kind target --measurement full
          --storage-mode "$BENCHMARK_MODE" --payload-sizes 1024
          --fraction "$BENCHMARK_FRACTION" --report-only
      - name: Summarize target measurements, including failed qualification
        if: always()
        run: |
          if [ -d logs/benchmarks/resources ]; then
            find logs/benchmarks/resources -name comparison.txt -exec cat {} + >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Retain target measurements, JFR and test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: node-target-${{ matrix.mode }}-${{ github.run_attempt }}
          path: |
            logs/benchmarks/resources/
            logs/benchmarks/node-target/
            **/target/surefire-reports/
          retention-days: 14

  publish-benchmark-badges:
    needs: [unit-tests, integration-tests, windows-functional, node-target-benchmark]
    if: >-
      always() && needs.unit-tests.result == 'success' && needs.integration-tests.result == 'success'
      && needs.windows-functional.result == 'success' && needs.node-target-benchmark.result != 'cancelled'
      && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
      && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: benchmark-badges-${{ github.repository }}-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: node-target-*-${{ github.run_attempt }}
          path: reports
      - name: Generate latest target and JFR badges with qualification and provenance
        env:
          WORKFLOW_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SOURCE_REVISION: ${{ github.sha }}
        run: >-
          python3 scripts/publish-node-target-badges.py --input reports --workflow-url "$WORKFLOW_URL"
          --revision "$SOURCE_REVISION" --allow-incomplete
      - name: Commit measured badge data
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          SOURCE_REVISION: ${{ github.sha }}
        run: |
          git fetch origin "$DEFAULT_BRANCH"
          if [ "$(git rev-parse FETCH_HEAD)" != "$SOURCE_REVISION" ]; then
            echo "A newer commit exists; its workflow will publish the latest measurements."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md benchmark-badges/*.json benchmark-badges/*.svg
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Update node-target benchmark and JFR badges [skip ci]"
          git push origin "HEAD:$DEFAULT_BRANCH"
