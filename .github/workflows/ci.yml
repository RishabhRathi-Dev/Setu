name: Build, integration tests, and capacity benchmark

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java 26
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '26'
          cache: maven

      - name: Build and test production modules
        run: bash ./mvnw --batch-mode --no-transfer-progress -pl setu-storage,setu-core,setu-security,setu-client,setu-server -am test

      - name: Package broker and verify AOT caching with ZGC
        shell: bash
        run: |
          set -o pipefail
          bash ./mvnw --batch-mode --no-transfer-progress -pl setu-server -am -DskipTests package
          bash ./scripts/start-broker.sh --train-aot
          java -XX:+UseZGC -XX:+UseStringDeduplication -XX:AOTMode=on \
            -XX:AOTCache=setu-server/target/setu-server.aot -Xlog:aot=info \
            -jar setu-server/target/setu-server-1.0.0-SNAPSHOT.jar --aot-train \
            2>&1 | tee "$RUNNER_TEMP/aot-validation.log"
          python3 -c 'import os, pathlib; report = (pathlib.Path(os.environ["RUNNER_TEMP"]) / "aot-validation.log").read_text(); assert "Using AOT-linked classes: true" in report, "AOT-linked classes were not enabled"'

  integration-tests:
    runs-on: ubuntu-latest
    needs: unit-tests
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java 26
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '26'
          cache: maven

      - name: Run end-to-end application integration tests
        run: bash ./mvnw --batch-mode --no-transfer-progress -pl setu-integration-tests -am '-Dtest=*IntegrationTests' -Dsurefire.failIfNoSpecifiedTests=false test

  chaos-benchmark:
    runs-on: ubuntu-latest
    needs: integration-tests
    timeout-minutes: 60
    concurrency:
      group: benchmark-badges-${{ github.repository }}-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java 26
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '26'
          cache: maven

      - name: Run bounded broker chaos tests
        shell: bash
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/logs"
          bash ./mvnw --batch-mode --no-transfer-progress -pl setu-benchmark -am '-Dtest=*ChaosTests,!ProgressiveCapacityChaosTests,QuickBrokerChaosBenchmarkTests,ProcessCpuSamplerTests,CpuSaturationHoldTests,CapacityJfrTests' -Dsurefire.failIfNoSpecifiedTests=false -Dsetu.log.level=INFO test 2>&1 | tee "$RUNNER_TEMP/logs/bounded-chaos.log"

      - name: Verify benchmark report isolation
        run: python3 -m unittest discover -s scripts -p 'test_benchmark_badges.py'

      - name: Measure steady throughput in isolated broker and client processes
        shell: bash
        run: |
          set -o pipefail
          bash ./mvnw --batch-mode --no-transfer-progress -pl setu-benchmark -am \
            '-Dtest=IsolatedThroughputBenchmarkTests' -Dsurefire.failIfNoSpecifiedTests=false \
            -Dsetu.benchmark.steady.rate=10000 -Dsetu.benchmark.steady.seconds=3 test \
            2>&1 | tee "$RUNNER_TEMP/logs/steady-throughput.log"

      - name: Measure bounded file ingestion with larger batches
        shell: bash
        run: |
          set -o pipefail
          bash ./mvnw --batch-mode --no-transfer-progress -pl setu-benchmark -am \
            '-Dtest=ProgressiveCapacityChaosTests#progressivelyRampsFileProducersAndConsumersUntilTheRuntimeLimit' \
            -Dsurefire.failIfNoSpecifiedTests=false -Dsetu.log.level=INFO \
            -Dsetu.benchmark.batch.records=4096 -Dsetu.benchmark.max.concurrency=2 \
            -Dsetu.benchmark.warmup.millis=2000 -Dsetu.benchmark.stage.millis=12000 \
            -Dsetu.benchmark.jfr=true -Dsetu.benchmark.memory.log.bytes=268435456 test \
            2>&1 | tee "$RUNNER_TEMP/logs/capacity-large-batch.log"

      - name: Run progressive capacity exhaustion last
        shell: bash
        run: |
          set -o pipefail
          bash ./mvnw --batch-mode --no-transfer-progress -pl setu-benchmark -am \
            '-Dtest=ProgressiveCapacityChaosTests' -Dsurefire.failIfNoSpecifiedTests=false \
            -Dsetu.log.level=INFO -Dsetu.benchmark.batch.records=256 \
            -Dsetu.benchmark.stage.millis=2000 -Dsetu.benchmark.warmup.millis=2000 \
            -Dsetu.benchmark.cpu.hold.millis=10000 -Dsetu.benchmark.max.concurrency=0 \
            -Dsetu.benchmark.min.stages=8 -Dsetu.benchmark.memory.log.bytes=268435456 \
            -Dsetu.benchmark.jfr=true \
            test 2>&1 | tee "$RUNNER_TEMP/logs/capacity-default.log"

      - name: Generate badges from the latest capacity metrics
        if: success() && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        run: >-
          python3 scripts/update-benchmark-badges.py
          --log "$RUNNER_TEMP/logs/capacity-default.log"
          --repository "$GITHUB_REPOSITORY"
          --server-url "$GITHUB_SERVER_URL"
          --visibility "${{ github.event.repository.private && 'private' || 'public' }}"
          --minimum-stages 8 --require-jfr

      - name: Retain benchmark logs and failure reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-diagnostics-${{ github.run_attempt }}
          path: |
            logs/
            ${{ runner.temp }}/logs/
            **/target/surefire-reports/
          retention-days: 14

      - name: Publish latest benchmark badges
        if: success() && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md benchmark-badges/*.json
          if git diff --cached --quiet; then
            echo "Benchmark badge metrics are unchanged."
            exit 0
          fi
          git commit -m "Update benchmark metric badges [skip ci]"
          git push origin "HEAD:${{ github.event.repository.default_branch }}"
