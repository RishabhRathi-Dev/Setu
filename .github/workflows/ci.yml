name: Build, integration tests, and capacity benchmark

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build and test production modules
        run: bash ./mvnw --batch-mode --no-transfer-progress -pl setu-storage,setu-core,setu-security,setu-client,setu-server -am test

  integration-tests:
    runs-on: ubuntu-latest
    needs: unit-tests
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Run end-to-end application integration tests
        run: bash ./mvnw --batch-mode --no-transfer-progress -pl setu-integration-tests -am '-Dtest=*IntegrationTests' -Dsurefire.failIfNoSpecifiedTests=false test

  chaos-benchmark:
    runs-on: ubuntu-latest
    needs: integration-tests
    timeout-minutes: 60
    concurrency:
      group: benchmark-badges-${{ github.repository }}-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Run bounded broker chaos tests
        shell: bash
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/logs"
          bash ./mvnw --batch-mode --no-transfer-progress -pl setu-benchmark -am '-Dtest=*ChaosTests,!ProgressiveCapacityChaosTests,QuickBrokerChaosBenchmarkTests' -Dsurefire.failIfNoSpecifiedTests=false test 2>&1 | tee -a "$RUNNER_TEMP/logs/setu-benchmark-output.log"

      - name: Measure bounded file ingestion with larger batches
        run: >-
          bash ./mvnw --batch-mode --no-transfer-progress -pl setu-benchmark -am
          '-Dtest=ProgressiveCapacityChaosTests#progressivelyRampsFileProducersAndConsumersUntilTheRuntimeLimit'
          -Dsurefire.failIfNoSpecifiedTests=false
          -Dsetu.benchmark.batch.records=4096
          -Dsetu.benchmark.max.concurrency=2
          -Dsetu.benchmark.stage.millis=12000 test

      - name: Run progressive capacity exhaustion last
        shell: bash
        run: |
          set -o pipefail
          bash ./mvnw --batch-mode --no-transfer-progress -pl setu-benchmark -am '-Dtest=ProgressiveCapacityChaosTests' -Dsurefire.failIfNoSpecifiedTests=false test 2>&1 | tee -a "$RUNNER_TEMP/logs/setu-benchmark-output.log"

      - name: Generate badges from the latest capacity metrics
        if: success() && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        run: >-
          python3 scripts/update-benchmark-badges.py
          --log "$RUNNER_TEMP/logs/setu-benchmark-output.log"
          --repository "$GITHUB_REPOSITORY"
          --server-url "$GITHUB_SERVER_URL"
          --visibility "${{ github.event.repository.private && 'private' || 'public' }}"

      - name: Retain benchmark logs and failure reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-diagnostics-${{ github.run_attempt }}
          path: |
            logs/
            ${{ runner.temp }}/logs/
            **/target/surefire-reports/
          retention-days: 14

      - name: Publish latest benchmark badges
        if: success() && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md benchmark-badges/*.json
          if git diff --cached --quiet; then
            echo "Benchmark badge metrics are unchanged."
            exit 0
          fi
          git commit -m "Update benchmark metric badges [skip ci]"
          git push origin "HEAD:${{ github.event.repository.default_branch }}"
