# IntelliJ local debugging profile. Unspecified properties keep launcher defaults.
# Each profile owns its ports, data and logs; runtime files remain ignored.
bind.host=127.0.0.1
bind.port=19093
storage.mode=FILE
transport=selector
data.dir=data/intellij/file-selector
operations.port=18081
# Allow longer pauses at breakpoints. Absolute deadlines remain bounded.
socket.timeout.millis=0
handshake.timeout.millis=600000
frame.timeout.millis=600000
write.timeout.millis=600000
ack.timeout.millis=600000
consumer.timeout.millis=600000
# Keep history during local debugging; no age-based deletion.
file.retention.millis=0
memory.retention.millis=0
