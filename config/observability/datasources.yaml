apiVersion: 1
datasources:
  - name: Setu Mimir
    uid: setu-mimir
    type: prometheus
    access: proxy
    url: http://mimir:9009/prometheus
    jsonData:
      httpMethod: POST
      timeInterval: 5s
      prometheusType: Mimir
  - name: Setu Loki
    uid: setu-loki
    type: loki
    access: proxy
    url: http://localhost:3100
    jsonData:
      derivedFields:
        - name: TraceID
          matcherType: label
          matcherRegex: trace_id
          datasourceUid: setu-tempo
          url: '$${__value.raw}'
  - name: Setu Tempo
    uid: setu-tempo
    type: tempo
    access: proxy
    url: http://localhost:3200
    jsonData:
      tracesToLogsV2:
        datasourceUid: setu-loki
        spanStartTimeShift: '-1m'
        spanEndTimeShift: '1m'
        filterByTraceID: true
        tags:
          - key: service.name
            value: service_name
