# Load using -Dotel.javaagent.configuration-file=config/observability/otel-agent.properties.
# The agent is an external, optional runtime tool; Setu includes only the OTel API.
otel.service.name=setu
otel.resource.attributes=service.instance.id=local-setu,deployment.environment.name=development
otel.exporter.otlp.endpoint=http://127.0.0.1:4318
otel.exporter.otlp.protocol=http/protobuf
otel.traces.exporter=otlp
otel.logs.exporter=otlp
# JVM and broker metrics have one collection path: /metrics -> Alloy -> Mimir.
otel.metrics.exporter=none
otel.instrumentation.logback-appender.enabled=true
otel.instrumentation.logback-mdc.enabled=true
# Sample root spans and follow remote parent decisions; use 1.0 on client roots for local checks.
otel.traces.sampler=parentbased_traceidratio
otel.traces.sampler.arg=0.1
