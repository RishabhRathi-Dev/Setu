# Local-development plaintext launcher. Use SecureServerFactory for TLS/mTLS.
bind.host=127.0.0.1
bind.port=9092
storage.mode=FILE
# Shared accounted payload/chunk budget for IN_MEMORY; 0 disables the limit.
memory.log.max.bytes=268435456
# Optional lossy maximum age in IN_MEMORY; 0 retains acknowledgement-based reclamation.
memory.retention.millis=0
# Shared per-server budgets; requests also account for connection buffering.
requests.max.bytes=134217728
responses.max.bytes=134217728
# Slow socket readers are disconnected after this total reply-write deadline.
write.timeout.millis=30000
data.dir=data
transport=blocking
record.max.bytes=1048576
# Chronicle memory mapping block size (minimum 64 MiB); roll cycles are daily.
queue.block.bytes=67108864
# Optional FILE age limit, measured from the end of each daily cycle; 0 disables retention.
# Cleanup runs at startup and every minute, always preserving the newest populated cycle.
file.retention.millis=0
connections.max=10000
accept.backlog=256
# Idle/read timeout; 0 disables only the idle/read timeout.
socket.timeout.millis=60000
# Absolute setup and first-byte-to-complete-frame deadlines; both must be positive.
handshake.timeout.millis=10000
frame.timeout.millis=30000
# Active consumer identities and summed member/topic partition counts in either mode.
# The same limits separately bound retained FILE managed groups and their partition offsets.
consumers.max=10000
consumer.partitions.max=100000
ack.timeout.millis=30000
consumer.timeout.millis=60000
