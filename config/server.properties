# Local-development plaintext launcher. Use SecureServerFactory for TLS/mTLS.
bind.host=127.0.0.1
bind.port=9092
storage.mode=FILE
# Shared accounted payload/chunk budget for IN_MEMORY; 0 disables the limit.
memory.log.max.bytes=268435456
# Optional lossy maximum age in IN_MEMORY; 0 retains acknowledgement-based reclamation.
memory.retention.millis=0
# Shared per-server budgets; requests also account for connection buffering.
requests.max.bytes=134217728
responses.max.bytes=134217728
# Slow socket readers are disconnected after this total reply-write deadline.
write.timeout.millis=30000
data.dir=data
transport=blocking
record.max.bytes=1048576
# Chronicle memory mapping block size (minimum 64 MiB); roll cycles are daily.
queue.block.bytes=67108864
connections.max=10000
accept.backlog=256
socket.timeout.millis=0
ack.timeout.millis=30000
consumer.timeout.millis=60000
